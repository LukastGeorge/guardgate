server:
  port: ${DEMO_SERVICE_PORT:8082}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: demo-service

guardgate:
  demo:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:guardgate-auth}
      audience: ${JWT_AUDIENCE:guardgate}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
