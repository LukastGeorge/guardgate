# Toàn bộ GuardGate: Postgres + Redis + auth-service + demo-service + gateway.
#   docker compose up -d --wait              # chỉ hạ tầng (dev chạy app bằng mvnw)
#   docker compose up -d --build --wait      # cả hệ thống trong container
#
# Mọi secret lấy từ file .env (KHÔNG commit). Cú pháp ${VAR:?msg} làm compose
# dừng ngay nếu thiếu biến, thay vì âm thầm chạy với mật khẩu rỗng.
# Chỉ gateway publish cổng ứng dụng ra host; Postgres/Redis publish 127.0.0.1 để dev chạy app ngoài Docker
# (staging dùng docker-compose.staging.yml để bỏ luôn hai cổng này).

name: guardgate

services:
  postgres:
    image: postgres:19.0-alpine
    container_name: guardgate-postgres
    restart: unless-stopped
    environment:
      # Tài khoản superuser: chỉ dùng cho init/quản trị, ứng dụng KHÔNG dùng tài khoản này
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      # Thông tin DB + user riêng cho auth-service (least privilege), dùng bởi script init
      AUTH_DB_NAME: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
      AUTH_DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      # Bắt buộc xác thực bằng SCRAM-SHA-256 thay vì md5/trust
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      # Chỉ bind vào localhost: máy khác trong mạng LAN không truy cập được
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  redis:
    image: redis:7.4.6-alpine
    container_name: guardgate-redis
    restart: unless-stopped
    environment:
      # redis-cli tự đọc biến REDISCLI_AUTH -> không phải truyền mật khẩu qua tham số dòng lệnh
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDISCLI_AUTH"
        --appendonly yes
        --protected-mode yes
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command CONFIG ""
        --rename-command DEBUG ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  # ---------- Ứng dụng (build từ Dockerfile dùng chung) ----------
  # Cứng hoá chung: filesystem chỉ đọc (chỉ /tmp ghi được, nằm trên RAM), bỏ mọi Linux capability,
  # cấm leo quyền, giới hạn RAM. App bị chiếm quyền cũng khó cài mã độc hay leo thang.

  auth-service:
    build:
      context: .
      args: {MODULE: auth-service, PORT: "8081"}
    image: ${IMAGE_REGISTRY:-guardgate}/guardgate-auth-service:${IMAGE_TAG:-dev}
    container_name: guardgate-auth-service
    restart: unless-stopped
    # Liệt kê TƯỜNG MINH từng biến (không dùng env_file: .env): container chỉ nhận đúng secret nó cần.
    # auth-service: khoá ký JWT + mật khẩu DB riêng của nó; KHÔNG có mật khẩu superuser Postgres.
    environment:
      DB_HOST: postgres
      POSTGRES_PORT: "5432"      # cổng TRONG mạng Docker (cổng host trong .env có thể khác)
      AUTH_DB_NAME: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
      AUTH_DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-guardgate-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-guardgate}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCK_DURATION: ${LOGIN_LOCK_DURATION:-15m}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-12}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [backend]

  demo-service:
    build:
      context: .
      args: {MODULE: demo-service, PORT: "8082"}
    image: ${IMAGE_REGISTRY:-guardgate}/guardgate-demo-service:${IMAGE_TAG:-dev}
    container_name: guardgate-demo-service
    restart: unless-stopped
    environment:
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    networks: [backend]

  gateway:
    build:
      context: .
      args: {MODULE: gateway, PORT: "8080"}
    image: ${IMAGE_REGISTRY:-guardgate}/guardgate-gateway:${IMAGE_TAG:-dev}
    container_name: guardgate-gateway
    restart: unless-stopped
    # Gateway hướng Internet: KHÔNG giữ khoá ký JWT hay mật khẩu DB (chỉ cần public key qua JWKS + Redis).
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_ISSUER: ${JWT_ISSUER:-guardgate-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-guardgate}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-0}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-5s}
      AUTH_SERVICE_URL: http://auth-service:8081
      DEMO_SERVICE_URL: http://demo-service:8082
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      demo-service: {condition: service_healthy}
    ports:
      # Điểm vào DUY NHẤT của hệ thống
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [backend]

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
    name: guardgate-backend
