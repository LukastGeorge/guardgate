server:
  port: ${GATEWAY_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: gateway
  # Routes, JWT filter và rate limiter (Redis) sẽ được cấu hình ở giai đoạn 3.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
