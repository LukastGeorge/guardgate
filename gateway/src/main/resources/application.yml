server:
  port: ${GATEWAY_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

guardgate:
  gateway:
    jwt:
      # Public key của auth-service; trong K8s là http://auth-service:8081/.well-known/jwks.json
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:guardgate-auth}
      audience: ${JWT_AUDIENCE:guardgate}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
