# CI/CD DevSecOps của GuardGate.
#   build + test → SAST (Semgrep) → secrets (Gitleaks) → dependencies (Trivy fs) → image + Trivy image
#   + Helm chart gates (lint, kubeconform, policy, trivy config)
#   → [chỉ main] publish GHCR + SBOM + cosign → staging (k3d + Helm, đúng digest đã verify)
#   → smoke + NetworkPolicy runtime → DAST (OWASP ZAP baseline)
# Pipeline FAIL khi có lỗ hổng HIGH/CRITICAL. Không bước quét nào được phép "|| true" / continue-on-error.
#
# Supply chain của chính pipeline: mọi action pin theo commit SHA (tag có thể bị trỏ lại sang code khác),
# job pin-check chặn mọi `uses:` không có SHA; quyền GITHUB_TOKEN mặc định chỉ đọc, job nào cần thêm mới xin.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Không huỷ run trên main: huỷ giữa lúc publish có thể để lại image đã push nhưng chưa ký
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
  # v0.76.2: release immutable sau sự cố supply-chain của Trivy (3/2026); v0.27–v0.69.1 đã bị gỡ khỏi GitHub
  TRIVY_VERSION: v0.76.2
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  build-test:
    name: Build + unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers dùng Docker có sẵn trên ubuntu-latest (Postgres + Redis thật)
      - run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/target/*-reports/"
          retention-days: 7

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (fail on ERROR)
        run: |
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" semgrep scan \
            --config p/java --config p/owasp-top-ten --config p/secrets \
            --metrics=off --error --severity ERROR \
            --sarif --output /src/semgrep.sarif /src
      - name: Upload SARIF to Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Secrets in git history (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # quét TOÀN BỘ lịch sử, không chỉ commit cuối
          persist-credentials: false
      - name: Gitleaks
        # Wrapper: khai safe.directory (container root vs repo của user runner) và FAIL nếu git lỗi
        # hoặc quét 0 commit — Gitleaks tự nó vẫn trả exit 0 trong các trường hợp đó.
        run: bash scripts/run-gitleaks.sh .

  trivy-fs:
    name: Dependencies, secrets, misconfig (Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Không tải pom cha từ Maven Central (dễ bị 429 trên runner dùng chung). Cổng dependency chính xác
          # là job `image` (Trivy đọc jar thật trong image).
          TRIVY_OFFLINE_SCAN: "true"
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml   # chấp nhận rủi ro có hạn, xem file
          format: sarif
          output: trivy-fs.sarif
          # Không có dòng này, trivy-action BỎ bộ lọc severity khi xuất SARIF → fail cả LOW/MEDIUM
          limit-severities-for-sarif: true
      - name: Upload SARIF to Security tab
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  pin-check:
    name: Actions pinned by SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every `uses:` must reference a 40-char commit SHA
        run: |
          unpinned=$(grep -nE '^\s*-?\s*uses:\s*[^./][^@]*@' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Unpinned actions found:"; echo "$unpinned"; exit 1
          fi
          echo "All actions are pinned by SHA"
      - name: Lint workflows (actionlint + shellcheck)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Risk-accepted CVEs still have valid preconditions
        run: bash scripts/check-risk-acceptance.sh
      - name: Tests of the gate scripts themselves
        run: |
          bash scripts/tests/zap-gate.test.sh
          bash scripts/tests/ci-staging-env.test.sh
          bash scripts/tests/workflow-policy.test.sh
          bash scripts/tests/compose-secrets.test.sh

  helm:
    name: Helm chart gates (lint, kubeconform, policy, trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm (official release, pinned SHA256)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz
          echo "9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Chart policy (helm lint + kubeconform -strict + securityContext/secret/network rules)
        run: bash scripts/tests/helm-policy.test.sh
      - name: The policy test itself rejects a deliberately insecure values file
        run: |
          if bash scripts/tests/helm-policy.test.sh scripts/tests/testdata/helm-bad-values.yaml; then
            echo "::error::helm-policy test accepted helm-bad-values.yaml"; exit 1
          fi
      - name: Trivy config on the chart (fail on HIGH/CRITICAL)
        run: docker run --rm -v "$PWD/charts:/charts:ro" "$TRIVY_IMAGE" config --severity HIGH,CRITICAL --exit-code 1 /charts/guardgate
      - name: create-secrets.sh never leaks values
        run: bash scripts/tests/create-secrets.test.sh

  image:
    name: Image ${{ matrix.module }} (build + verify + Trivy)
    needs: [build-test, semgrep, gitleaks, trivy-fs, pin-check, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: auth-service, port: "8081"}
          - {module: gateway, port: "8080"}
          - {module: demo-service, port: "8082"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
            REVISION=${{ github.sha }}
          tags: guardgate-${{ matrix.module }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
      - name: Verify container hardening (non-root, no secrets/sources, healthcheck)
        run: bash scripts/verify-image.sh guardgate-${{ matrix.module }}:ci
      - name: Trivy image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: guardgate-${{ matrix.module }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  # ---------------- Chỉ chạy trên main: publish → staging → DAST ----------------

  publish:
    name: Publish ${{ matrix.module }} (GHCR + SBOM + cosign)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write     # cosign keyless: danh tính ký là OIDC token của chính workflow này
    strategy:
      fail-fast: true
      matrix:
        include:
          - {module: auth-service, port: "8081"}
          - {module: gateway, port: "8080"}
          - {module: demo-service, port: "8082"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (GHCR yêu cầu chữ thường)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guardgate-${{ matrix.module }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
            REVISION=${{ github.sha }}
          # Chỉ tag SHA ở đây; :latest được gắn SAU khi quét + ký + attest thành công
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.module }}
      # Image vừa push được build LẠI (base image có thể đã đổi so với job `image`) → phải quét chính
      # digest này trước khi ký. Không quét thì không ký, không gắn latest, staging không deploy được.
      - name: Trivy gate on the exact pushed digest (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign image (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.module }}.cdx.json
      - name: Attest SBOM to the image
        run: cosign attest --yes --type cyclonedx --predicate "sbom-${{ matrix.module }}.cdx.json" "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Tag :latest (only after scan + sign + attest succeeded)
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.module }}
          path: sbom-${{ matrix.module }}.cdx.json

  staging-dast:
    name: Staging (k3d + Helm) + smoke + netpol + OWASP ZAP baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
      KUBECONFIG: ${{ github.workspace }}/.tools/kubeconfig
      BASE_URL: http://guardgate.localhost:8088
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # Verify theo tag rồi deploy CHÍNH digest mà cosign đã verify (không resolve tag lần hai -> hết TOCTOU)
      - name: Verify image signatures and capture the verified digests
        run: |
          digests=""
          for m in auth-service gateway demo-service; do
            out=$(cosign verify "$IMAGE_REGISTRY/guardgate-$m:$IMAGE_TAG" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com)
            d=$(jq -r '[.[].critical.image["docker-manifest-digest"]] | unique | if length == 1 then .[0] else "" end' <<<"$out")
            if [[ ! "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::no single verified digest for $m"; exit 1; fi
            digests+="${digests:+,}$m=$d"
            echo "signature OK: guardgate-$m@$d"
          done
          echo "GG_IMAGE_DIGESTS=$digests" >> "$GITHUB_ENV"
      - name: Install Helm and k3d (official releases, pinned SHA256)
        run: |
          mkdir -p .tools "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz
          echo "9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
          curl -fsSLo .tools/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  .tools/k3d" | sha256sum -c -
          chmod +x .tools/k3d
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Ephemeral secrets for this run only
        run: bash scripts/ci-staging-env.sh > .env
      - name: Registry pull secret for the cluster (short-lived GITHUB_TOKEN, packages:read)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$RUNNER_TEMP/pull.json"
      - name: Deploy staging on k3d (images pinned by verified digest)
        env:
          GG_PULL_SECRET_FILE: ${{ runner.temp }}/pull.json
        run: |
          GG_IMAGE_REGISTRY="$IMAGE_REGISTRY" GG_IMAGE_TAG="$IMAGE_TAG" GG_IMAGE_DIGESTS="$GG_IMAGE_DIGESTS" \
            bash scripts/k8s/up.sh .env
          rm -f "$GG_PULL_SECRET_FILE"
      - name: Running workloads use exactly the verified digests
        run: |
          for pair in ${GG_IMAGE_DIGESTS//,/ }; do
            m=${pair%%=*} d=${pair#*=}
            img=$(kubectl -n guardgate get deploy "$m" -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [[ "$img" != *"@$d" ]]; then echo "::error::$m runs $img, expected digest $d"; exit 1; fi
            echo "$m: $img"
          done
      - name: Postgres/Redis must not be reachable from the host
        run: |
          # bash /dev/tcp có sẵn trong bash (không phụ thuộc nc: thiếu nc thì check cũ "pass" mà không kiểm tra gì)
          for port in 5432 6379; do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "::error::port $port is reachable on the host"; exit 1
            fi
            echo "port $port: not reachable from the host (OK)"
          done
      - name: Smoke test through Traefik ingress and the gateway
        run: bash scripts/smoke-test.sh "$BASE_URL"
      - name: NetworkPolicy runtime checks
        run: bash scripts/tests/k8s-netpol.test.sh
      - name: OWASP ZAP baseline (passive scan)
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod 777 zap
          rc=0
          docker run --rm --network host --add-host guardgate.localhost:127.0.0.1 -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$BASE_URL" -c rules.tsv -J zap-report.json -r zap-report.html -I || rc=$?
          echo "zap-baseline exit code: $rc"
          # -I: không fail vì WARN; exit 3 = ZAP tự lỗi → FAIL. Quyết định cuối do zap-gate.sh (đọc report).
          if [ "$rc" -eq 3 ]; then echo "::error::ZAP failed to run"; exit 1; fi
      - name: DAST gate (fail on High)
        run: bash scripts/zap-gate.sh zap/zap-report.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: zap/
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n guardgate get pods,events -o wide || true
          for d in auth-service gateway demo-service; do kubectl -n guardgate logs "deploy/$d" --tail 100 || true; done
      - name: Tear down
        if: always()
        run: bash scripts/k8s/down.sh
