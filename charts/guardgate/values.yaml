# GuardGate Helm values.
# Chart KHÔNG BAO GIỜ chứa giá trị secret: các Secret được tạo bên ngoài (scripts/k8s/create-secrets.sh)
# và chỉ được tham chiếu theo tên qua `secretRefs` (D21: mỗi component chỉ thấy secret của nó).

namespace:
  # false (mặc định): namespace được tạo TRƯỚC khi cài chart (Secret phải có sẵn trước khi pod chạy).
  # scripts/k8s/up.sh render chính template này với create=true rồi kubectl apply -> nhãn PSA chỉ khai báo một nơi.
  create: false

image:
  # Ảnh = <registry>/guardgate-<app>:<tag>[@<digest>]. CI đặt tag = SHA commit và digest đã cosign verify.
  registry: guardgate
  tag: dev
  pullPolicy: IfNotPresent

# securityContext dùng chung cho mọi pod/container ứng dụng (uid 10001 trùng USER trong Dockerfile)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: [ALL]

# Database riêng của auth-service (không phải secret). Postgres init và auth-service cùng đọc giá trị này.
authDb:
  name: guardgate_auth
  user: guardgate_auth

# Thông số JWT dùng chung cho cả 3 service (không phải secret)
jwt:
  issuer: guardgate-auth
  audience: guardgate

apps:
  auth-service:
    enabled: true
    port: 8081
    replicas: 1
    digest: ""
    resources:
      requests: {cpu: 250m, memory: 384Mi}
      limits: {cpu: "1", memory: 512Mi}
    env:
      AUTH_SERVICE_PORT: "8081"
      DB_HOST: postgres
      POSTGRES_PORT: "5432"
      AUTH_DB_NAME: "{{ .Values.authDb.name }}"
      AUTH_DB_USER: "{{ .Values.authDb.user }}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 7d
      LOGIN_MAX_FAILED_ATTEMPTS: "5"
      LOGIN_LOCK_DURATION: 15m
      BCRYPT_STRENGTH: "12"
      BOOTSTRAP_ADMIN_EMAIL: ""
    # JWT_PRIVATE_KEY, AUTH_DB_PASSWORD, REDIS_PASSWORD, BOOTSTRAP_ADMIN_PASSWORD
    secretRefs: [guardgate-auth]

  demo-service:
    enabled: true
    port: 8082
    replicas: 1
    digest: ""
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 384Mi}
    env:
      DEMO_SERVICE_PORT: "8082"
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    secretRefs: []

  gateway:
    enabled: true
    port: 8080
    replicas: 1
    digest: ""
    resources:
      requests: {cpu: 250m, memory: 384Mi}
      limits: {cpu: "1", memory: 512Mi}
    env:
      GATEWAY_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ALLOWED_ORIGINS: ""
      # Traefik là proxy DUY NHẤT phía trước gateway (Review Focus #5)
      GATEWAY_TRUSTED_PROXIES: "1"
      GATEWAY_RESPONSE_TIMEOUT: 5s
      AUTH_SERVICE_URL: http://auth-service:8081
      DEMO_SERVICE_URL: http://demo-service:8082
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json
    # Chỉ REDIS_PASSWORD — gateway hướng Internet, không giữ khoá ký JWT hay mật khẩu DB
    secretRefs: [guardgate-gateway]

# Probe (JVM khởi động chậm: startupProbe cho tối đa 5s x 24 = 120 giây trước khi liveness có hiệu lực)
probes:
  startup: {periodSeconds: 5, failureThreshold: 24, timeoutSeconds: 3}
  readiness: {periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
  liveness: {periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}

# ---------- Hạ tầng dữ liệu (chỉ dành cho dev/staging; production nên dùng dịch vụ managed) ----------
postgres:
  enabled: true
  image: postgres:17.6-alpine
  adminUser: guardgate_admin
  # uid/gid của user "postgres" trong image alpine
  runAsUser: 70
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # POSTGRES_ADMIN_PASSWORD, AUTH_DB_PASSWORD
  secretName: guardgate-postgres

redis:
  enabled: true
  image: redis:7.4.6-alpine
  # uid/gid của user "redis" trong image alpine
  runAsUser: 999
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  # REDIS_PASSWORD
  secretName: guardgate-redis
