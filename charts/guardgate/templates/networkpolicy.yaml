{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- /*
  Đồ thị gọi nhau (kiến trúc, không phải cấu hình): [nguồn, đích, cổng].
  Mỗi component nhận một NetworkPolicy: ingress = các cạnh đi VÀO nó, egress = các cạnh đi RA từ nó.
*/}}
{{- $edges := list
      (list "gateway"      "auth-service" 8081)
      (list "gateway"      "demo-service" 8082)
      (list "gateway"      "redis"        6379)
      (list "demo-service" "auth-service" 8081)
      (list "auth-service" "postgres"     5432)
      (list "auth-service" "redis"        6379) }}
# Chặn TẤT CẢ ingress + egress của mọi pod trong namespace; các policy bên dưới chỉ mở đúng cạnh cần thiết
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardgate.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Mọi pod được hỏi DNS của cluster (thiếu rule này thì không resolve được "postgres", "redis"...)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardgate.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- range $c := list "gateway" "auth-service" "demo-service" "postgres" "redis" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $c }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "guardgate.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "guardgate.selectorLabels" (dict "name" $c "root" $) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if eq $c "gateway" }}
    # Chỉ ingress controller (Traefik) gọi được gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
    {{- end }}
    {{- range $e := $edges }}
    {{- if eq (index $e 1) $c }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "guardgate.selectorLabels" (dict "name" (index $e 0) "root" $) | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ index $e 2 }}}
    {{- end }}
    {{- end }}
  {{- $out := 0 }}
  {{- range $e := $edges }}{{ if eq (index $e 0) $c }}{{ $out = add1 $out }}{{ end }}{{ end }}
  {{- if eq $out 0 }}
  # Không gọi ra đâu cả (ngoài DNS ở allow-dns-egress)
  egress: []
  {{- else }}
  egress:
    {{- range $e := $edges }}
    {{- if eq (index $e 0) $c }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "guardgate.selectorLabels" (dict "name" (index $e 1) "root" $) | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ index $e 2 }}}
    {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
