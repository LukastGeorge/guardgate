{{- if .Values.postgres.enabled }}
# Headless Service cho StatefulSet: DNS "postgres" trỏ thẳng tới pod; chỉ dùng trong cluster
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "guardgate.labels" . | nindent 4 }}
    {{- include "guardgate.selectorLabels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "guardgate.selectorLabels" (dict "name" "postgres" "root" .) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
{{- end }}
