{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
# Mỗi component một ServiceAccount riêng, không có quyền RBAC nào và không mount token API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "guardgate.labels" $ | nindent 4 }}
    {{- include "guardgate.selectorLabels" (dict "name" $name "root" $) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
